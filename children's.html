<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الوجبات الرئيسية - مطعم الشيف وليد</title>
  <style>
    body {
      margin: 0;يم
      font-family: 'Cairo', sans-serif;
      background-color: #0d0d0d;
      background-image: url('background22.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #f0e6d2;
      text-align: center;
    }
    header img {
      width: 120px;
      margin: 2rem auto;
      display: block;
    }
    h1 {
      font-size: 2.5rem;
      color: #d4af37;
      margin-bottom: 2rem;
    }
    .menu-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding-bottom: 50px;
    }
    .item-card {
      background-color: #1a1a1a;
      border: 2px solid gold;
      border-radius: 20px;
      padding: 20px;
      width: 250px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .item-card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }
    .item-card img,
    .item-card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .item-card h2 {
      margin: 10px 0 0;
      font-size: 1.2em;
      color: white;
    }
    .item-card p {
      font-size: 0.9em;
      color: #ccc;
      margin: 5px 0;
    }
    .price {
      margin-top: 5px;
      font-size: 1.2em;
      color: gold;
    }
    footer {
      margin-top: 2rem;
      padding: 1rem;
      background-color: #1a1a1a;
    }
    footer a {
      background-color: #d4af37;
      color: #0d0d0d;
      padding: 1rem 2rem;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
    footer a:hover {
      background-color: #ffd700;
    }
  </style>
</head>
<body>

<header>
  <img src="res-logo2.png" alt="Restaurant Logo">
</header>

<h1>وجبات الاطفال </h1>

<div class="menu-container">

  <div class="item-card">
    <img src="https://via.placeholder.com/120x120.png?text=صورة" alt="شننتسلونيم مطبوخ" />
    <div>
      <h2>شنيتسل اطفال</h2>
      <p>قطع شنيتسل تشمل بطاطا مقليه</p>
      <div class="price">₪50</div>
    </div>
  </div>
    <div class="item-card">
    <img src="https://via.placeholder.com/120x120.png?text=صورة" alt="شننتسلونيم مطبوخ" />
    <div>
      <h2>باستا اطفال</h2>
      <p>باستا مطهوه مع صوص بندوده</p>
      <div class="price">₪50</div>
    </div>
  </div>
    <div class="item-card">
    <img src="https://via.placeholder.com/120x120.png?text=صورة" alt="شننتسلونيم مطبوخ" />
    <div>
      <h2>بيتسا اطفال</h2>
      <p>بيتسا اطفال مع اظافات</p>
      <div class="price">₪50</div>
    </div>
  </div>


</div>

<footer>
  <a href="javascript:history.back()">العودة إلى الصفحة السابقة</a>
</footer>

</body>
</html>
